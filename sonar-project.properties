# Análise do SonarQube Cloud. Organização e projectKey são passados pela CI
# (variável SONAR_ORGANIZATION); aqui ficam só as regras deste repositório.
sonar.projectName=analytics-service
sonar.sources=.
sonar.exclusions=tests/**,db/**
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
